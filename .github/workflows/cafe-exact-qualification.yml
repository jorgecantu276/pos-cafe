name: Exact Cafe ZIP isolated application rehearsal

on:
  push:
    branches: [codex/cafe-menu-delivery-finish]
    paths:
      - .github/workflows/cafe-exact-qualification.yml
      - scripts/testing/Start-CafeHostedDocker.ps1
      - scripts/testing/cafe-docker-loopback.cs
      - scripts/testing/local-api.mjs
      - scripts/testing/CafeHostedBoundary.psm1
      - scripts/testing/cafe-*.mjs
      - scripts/testing/cafe-qualification-input.json
      - scripts/testing/Run-HostedCafeQualification.ps1
      - scripts/testing/Invoke-CafeHostedManualFixture.ps1
      - scripts/testing/Invoke-CafeManualUpdate.ps1
      - scripts/testing/Get-CafeHostedArtifacts.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cafe-exact-application:
    # Draft asset visibility requires write authorization after numeric read403.
    # The shell token is exposed only to the early GET-only download step.
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      POS_ACCEPTANCE_DISPOSABLE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve exact unpublished candidate before provisioning
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/testing/Get-CafeHostedArtifacts.ps1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install chromium
      - name: Provision a new independently owned Windows and WSL test boundary
        timeout-minutes: 20
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ./scripts/testing/cafe-docker-loopback.cs -Destination ./scripts/staging/docker-loopback.cs
          ./scripts/testing/Start-CafeHostedDocker.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the unchanged customer ZIP with enforced process egress denial
        shell: pwsh
        run: ./scripts/testing/Run-HostedCafeQualification.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cafe-exact-application-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cafe-exact-evidence/
            ${{ runner.temp }}/pos-wsl-engine-*/canary-forwarding.json
            ${{ runner.temp }}/pos-wsl-engine-*/bootstrap-events.jsonl
          if-no-files-found: warn
          retention-days: 14
