name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Auth and backend integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      POS_PRINT_MODE: disabled
      POS_CLIP_ENABLED: '0'
      POS_BROWSER_QUALITY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - name: Exercise real Auth, PostgREST and production app on a disposable local backend
        run: npm run test:admin-http
      - name: Exercise phone preparation and pickup payment with real sessions and simulated printing
        run: npm run test:phone-http
      - name: Restore an actual encrypted business backup into a separate empty Auth/backend and operate it
        run: npm run test:restore-business
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55451
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-fixture-anon
      POS_PRINT_MODE: disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          POS_RECEIPT_CONTRACT_EVIDENCE: ${{ runner.temp }}/pos-receipt-contract.json
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npm run build:verify
      - run: npm run test:printing
        env:
          POS_RECEIPT_CONTRACT_EVIDENCE: ${{ runner.temp }}/pos-receipt-contract.json
      - name: Build and exercise a portable Windows release with loopback-only config
        shell: pwsh
        run: |
          $targetFile = Join-Path $env:RUNNER_TEMP 'pos-release-target.json'
          $releaseFolder = Join-Path $env:RUNNER_TEMP 'pos-release-fixture'
          @{ supabaseUrl = 'http://127.0.0.1:59999'; supabaseAnonKey = 'local-fixture-anon' } | ConvertTo-Json | Set-Content -LiteralPath $targetFile -Encoding utf8
          npm run release:windows -- $targetFile $releaseFolder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows/smoke-release.mjs $releaseFolder
