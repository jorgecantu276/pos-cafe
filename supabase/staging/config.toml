# Local disposable project only. Never link this directory to a hosted project.
project_id = "pos-cafe-staging-local"

[api]
enabled = true
port = 55451
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55452
shadow_port = 55450
major_version = 17

# Bootstrap reconstructs metadata, creates a synthetic Auth admin, then applies
# the candidate migration. CLI must not apply it before the baseline exists.
[db.migrations]
enabled = false
[db.seed]
enabled = false

[studio]
enabled = true
port = 55453
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55454

[auth]
enabled = true
site_url = "http://127.0.0.1:3101"
additional_redirect_urls = ["http://127.0.0.1:3101"]
enable_signup = false
minimum_password_length = 12

[auth.email]
# Enable the email/password provider; top-level enable_signup=false still
# prevents public registration. Staff are provisioned by the admin route.
enable_signup = true
enable_confirmations = false

[realtime]
enabled = false
[storage]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
